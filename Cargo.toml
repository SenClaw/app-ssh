[package]
name = "app-ssh"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ssh-manager"
path = "src/main.rs"

[dependencies]
# The Space App SDK lives in the SenClaw daemon repo. `branch = "main"` tracks
# it as it moves; swap it for `rev = "<sha>"` when a release has to be
# reproducible byte-for-byte months later. Cargo.lock records the exact commit
# either way, so a committed lockfile already makes CI builds repeatable.
app-space-sdk = { git = "https://github.com/SenClaw/senclaw.git", branch = "main" }
tokio = { version = "1.0", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
russh = "0.45.0"
russh-keys = "0.45.0"
async-trait = "0.1"
anyhow = "1.0"
dotenvy = "0.15"
tower-http = { version = "0.5", features = ["fs", "cors"] }
uuid = { version = "1.23.2", features = ["v4"] }
futures-util = "0.3.32"
russh-sftp = "2.3.0"
async-stream = "0.3.6"
tokio-stream = "0.1.18"
dirs = "6.0.0"

# Space App zips are capped at 20 MB by the hub. Stripping symbols and letting
# LTO drop unreachable code keeps the binary small.
[profile.release]
strip = true
lto = true
codegen-units = 1
